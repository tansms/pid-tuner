pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file('local.properties')
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
            return properties.getProperty('flutter.sdk')
        }
        // Fallback for CI environments
        def envFlutterSdk = System.getenv('FLUTTER_ROOT')
        if (envFlutterSdk != null) {
            return envFlutterSdk
        }
        // Try common locations
        def possiblePaths = [
            '/opt/hostedtoolcache/flutter/stable-3.19.6',
            '/usr/local/lib/flutter',
            '/home/runner/flutter'
        ]
        for (path in possiblePaths) {
            if (new File(path).exists()) {
                return path
            }
        }
        throw new GradleException("Flutter SDK not found. Please set FLUTTER_ROOT environment variable or create local.properties")
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.0" apply false
}

include ":app"